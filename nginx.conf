# ============================================================
# nginx.conf — Configuração do Servidor Web Nginx
# (Configuração do Nginx)
#
# O Nginx (pronuncia-se "Engine X") é um servidor web de alta performance.
# Aqui ele atua como "proxy reverso": recebe as requisições na porta 80
# e as repassa para o Next.js na porta 3000.
#
# Por que usar Nginx na frente do Next.js?
# 1. Melhor performance para arquivos estáticos (CSS, imagens, JS)
# 2. Pode servir múltiplos apps na mesma máquina
# 3. Adiciona cabeçalhos de segurança automaticamente
# 4. Prepara o caminho para HTTPS futuro
# ============================================================

# ── Bloco de eventos: configurações gerais de conexão ──
events {
  # Número máximo de conexões simultâneas por processo do Nginx
  # 1024 é suficiente para uma conveniência pequena/média
  worker_connections 1024;
}

# ── Bloco HTTP: configurações do protocolo web ──
http {

  # Inclui os tipos MIME padrão (diz ao navegador o tipo de cada arquivo)
  # Sem isso, o navegador não saberia que .css é uma folha de estilo
  include /etc/nginx/mime.types;

  # Tipo padrão para arquivos não reconhecidos
  default_type application/octet-stream;

  # ── Otimização de transferência de arquivos ──
  # sendfile: usa chamada do sistema operacional para enviar arquivos
  # mais eficientemente (sem copiar para memória do Nginx)
  sendfile on;

  # Tempo máximo que uma conexão pode ficar aberta sem atividade
  # 65 segundos é adequado para a maioria dos casos
  keepalive_timeout 65;

  # ── Compressão de respostas ──
  # Comprime HTML, CSS, JS antes de enviar para o navegador
  # Reduz o tráfego de rede em até 70%!
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # ── Definição do Servidor ──
  server {

    # Escuta na porta 80 (HTTP padrão — sem HTTPS)
    # Se quiser HTTPS, precisa configurar um certificado SSL
    listen 80;

    # Nome do servidor (aceita qualquer domínio ou IP)
    # Em produção real, troque por: server_name meusite.com.br;
    server_name _;

    # ── Configuração do Proxy Reverso ──
    # Tudo que chegar aqui ("/") é redirecionado para o Next.js
    location / {

      # Endereço interno do Next.js (nome do serviço no docker-compose)
      # "pdv_app" é o container_name do serviço app
      proxy_pass http://pdv_app:3000;

      # ── Cabeçalhos que repassam informações ao Next.js ──

      # Versão do protocolo HTTP (1.1 suporta conexões persistentes)
      proxy_http_version 1.1;

      # Necessário para WebSockets (atualizações em tempo real)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';

      # Repassa o nome do host original ao Next.js
      # (o Next.js precisa saber por qual domínio foi acessado)
      proxy_set_header Host $host;

      # Repassa o IP real do visitante ao Next.js
      # Sem isso, o Next.js veria apenas o IP do Nginx (127.0.0.1)
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Desativa o cache do Nginx para este proxy
      # O Next.js gerencia seu próprio cache
      proxy_cache_bypass $http_upgrade;
    }

    # ── Arquivos Estáticos do Next.js ──
    # Os arquivos em /_next/static/ (CSS, JS compilados) são cacheados
    # por 1 ano no navegador — eles têm hash no nome, nunca mudam
    location /_next/static/ {
      proxy_pass http://pdv_app:3000;

      # Cache agressivo para arquivos estáticos (365 dias)
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
